# Example terminal-which-key config.
# Install to ~/.config/terminal-which-key/config.yaml

title: Leader

keys:
  o:
    label: open
    keys:
      c:
        label: calendar
        # `run` -> replace the popup pane with the command. When the
        # command exits, herdr closes the temporary pane it created for
        # the leader launcher.
        run: calendar-tui

      # `pane` -> spawn the command in a NEW herdr pane (split from the
      # underlying tab), then close the which-key popup.
      l:
        label: lazygit
        pane:
          cmd: lazygit
          direction: down

      # `tab` -> open a new herdr tab.
      t:
        label: htop in new tab
        tab:
          name: htop
          cmd: htop

  # ------------------------------------------------------------------
  # | herdr navigation via raw `herdr` CLI calls                      |
  # ------------------------------------------------------------------
  z:
    label: herdr
    keys:
      d:
        label: detach
        herdr: [session, detach]
